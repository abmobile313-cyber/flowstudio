<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flow Studio · HR document</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#06050a"><link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Inter+Tight:wght@700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#06050a;--card:#110e1a;--ink:#f4f2ff;--mut:#a7a3bd;--line:rgba(255,255,255,.12);--p:#ff3d9a;--b:#3b82ff;--v:#9b5cff;--o:#ff8a1f;--y:#ffd43b;--g:#22d37f;
--rb:linear-gradient(90deg,#3b82ff,#9b5cff,#ff3d9a,#ff8a1f,#ffd43b,#22d37f)}
html,body{background:var(--bg);color:var(--ink);font-family:Inter,sans-serif;font-size:9.4pt;line-height:1.45}
.page{width:210mm;height:297mm;position:relative;overflow:hidden;padding:12mm 14mm 10mm;display:flex;flex-direction:column;gap:3.3mm}
.glow{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;z-index:0}
.g1{width:110mm;height:110mm;background:#9b5cff;top:-50mm;right:-40mm}
.g2{width:90mm;height:90mm;background:#ff3d9a;bottom:-45mm;left:-35mm;opacity:.22}
.page>*{position:relative;z-index:1}.page>.glow{position:absolute;z-index:0}.page>.bar{position:absolute}
.bar{position:absolute;top:0;left:0;right:0;height:2.2mm;background:var(--rb);z-index:2}
header{display:flex;justify-content:space-between;align-items:flex-start}
.brand{display:flex;gap:4mm;align-items:center}
.brand img{width:17mm;height:17mm;border-radius:4mm}
.brand h1{font-family:'Inter Tight',Inter;font-weight:800;font-size:19pt;letter-spacing:-.3pt}
.brand p{color:var(--mut);font-size:8.6pt}
.rbt{background:var(--rb);-webkit-background-clip:text;color:transparent}
.qt{text-align:right}
.qt .lbl{font-family:'JetBrains Mono',monospace;font-size:7pt;letter-spacing:2.5pt;color:var(--mut)}
.qt h2{font-family:'Inter Tight',Inter;font-weight:800;font-size:24pt;letter-spacing:1pt;line-height:1.05}
.qt .no{font-family:'JetBrains Mono',monospace;font-size:8.5pt;color:var(--y)}
.meta{display:grid;grid-template-columns:1.25fr 1fr;gap:4mm}
.card{background:linear-gradient(140deg,rgba(255,255,255,.08),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:3.5mm;padding:3.2mm 4.5mm}
.k{font-family:'JetBrains Mono',monospace;font-size:6.6pt;letter-spacing:1.8pt;color:var(--mut);text-transform:uppercase;margin-bottom:1.5mm}
.card b{font-size:10.5pt}
.kv{display:grid;grid-template-columns:auto 1fr;gap:1mm 4mm;font-size:8.6pt}
.kv span:nth-child(odd){color:var(--mut)}
.kv span:nth-child(even){text-align:right}
h3{font-family:'Inter Tight',Inter;font-weight:700;font-size:10.5pt;display:flex;align-items:center;gap:2.5mm;margin-bottom:2.5mm}
h3 i{width:6mm;height:1.2mm;border-radius:1mm;background:var(--rb);display:inline-block}
table{width:100%;border-collapse:collapse;font-size:8.6pt}
th{font-family:'JetBrains Mono',monospace;font-weight:400;font-size:6.6pt;letter-spacing:1.4pt;color:var(--mut);text-transform:uppercase;text-align:left;padding:0 2.5mm 2mm;border-bottom:1px solid var(--line)}
td{padding:1.7mm 2.5mm;border-bottom:1px solid var(--line);vertical-align:top}
td small{display:block;color:var(--mut);font-size:7.8pt;margin-top:.5mm}
.r{text-align:right;white-space:nowrap}
.dot{display:inline-block;width:2mm;height:2mm;border-radius:50%;margin-right:2mm;vertical-align:middle}
.tot{display:flex;justify-content:flex-end;margin-top:2mm}
.tot div{display:flex;gap:8mm;align-items:baseline;padding:2mm 5mm;border-radius:3mm;background:linear-gradient(90deg,rgba(59,130,255,.18),rgba(255,61,154,.18));border:1px solid rgba(255,61,154,.35)}
.tot span{color:var(--mut);font-size:8pt;letter-spacing:1.5pt;font-family:'JetBrains Mono',monospace}
.tot b{font-family:'Inter Tight',Inter;font-size:16pt;font-weight:800}
.note{color:var(--mut);font-size:7.8pt;margin-top:2mm}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:4mm}
.st{border-radius:3.5mm;padding:3mm 4.5mm;border:1px solid var(--line);position:relative;overflow:hidden}
.st.a{background:linear-gradient(140deg,rgba(59,130,255,.22),rgba(155,92,255,.12))}
.st.f{background:linear-gradient(140deg,rgba(255,61,154,.2),rgba(255,138,31,.12))}
.st .pc{font-family:'Inter Tight',Inter;font-weight:800;font-size:18pt;line-height:1}
.st .am{font-size:11.5pt;font-weight:700;margin-top:1mm}
.st p{color:var(--mut);font-size:8pt;margin-top:1mm}
.track{height:2mm;border-radius:1mm;background:linear-gradient(90deg,var(--b) 0 40%,var(--p) 40% 100%);margin-top:3mm}
.two{display:grid;grid-template-columns:1.35fr 1fr;gap:4mm}
ol{padding-left:4.5mm;font-size:8.2pt;display:grid;gap:.6mm}
ol li::marker{color:var(--p);font-weight:700}
.card ol b{color:var(--ink);font-size:inherit}
.line{border-bottom:1px dashed rgba(255,255,255,.3);display:inline-block;min-width:38mm;height:3.5mm}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:4mm;margin-top:auto}
.sig .s{border-top:1px solid var(--line);padding-top:2mm;font-size:8pt;color:var(--mut)}
.sig .s b{color:var(--ink);font-size:9pt;display:block}
.sig .space{height:7mm}
footer{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:6.8pt;color:var(--mut);letter-spacing:.8pt;border-top:1px solid var(--line);padding-top:2.5mm}
.sum{display:grid;grid-template-columns:1fr auto;gap:2mm 6mm;align-content:center;background:linear-gradient(140deg,rgba(255,255,255,.08),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:3.5mm;padding:4mm 4.5mm;font-size:8.8pt}.sum span{color:var(--mut)}.sum b{text-align:right}.sum b.ok{color:var(--g)}.st .pc{font-size:20pt}
html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{min-height:100vh}
.stage{display:flex;justify-content:center;padding:84px 12px 40px}
.sc{transform-origin:top center}
.page{box-shadow:0 30px 90px rgba(0,0,0,.6);border-radius:6px}
.tb{position:fixed;top:0;left:0;right:0;z-index:9;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px max(12px,env(safe-area-inset-right)) 12px max(12px,env(safe-area-inset-left));background:rgba(6,5,10,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);font:600 14px Inter,sans-serif}
.tb a,.tb button{font:inherit;color:#fff;text-decoration:none;border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:999px;padding:10px 16px;cursor:pointer}
.tb .wa{background:#22c55e;border:0;color:#04210f}.tb .pr{background:var(--rb);background-size:200%;border:0;color:#120a20}
.err{max-width:520px;margin:20vh auto;text-align:center;color:var(--mut);font:16px Inter,sans-serif;padding:0 16px}
@media print{.tb{display:none}.stage{padding:0;display:block}.sc{transform:none!important;height:auto!important}.page{box-shadow:none;border-radius:0}body{background:var(--bg)}}

.body p{font-size:9pt;line-height:1.6;color:#dcd8ee}.body p+p{margin-top:2mm}.body b{color:var(--ink)}
.dt{display:grid;grid-template-columns:repeat(3,1fr);gap:3mm}.dt .card{padding:2.6mm 4mm}.dt .card b{font-size:9.6pt;display:block}
.sigimg{position:absolute;left:0;bottom:-1mm;height:14mm;width:auto}
.stamp{position:absolute;right:6mm;bottom:2mm;width:22mm;height:22mm;border-radius:50%;border:.6mm solid rgba(155,92,255,.55);display:grid;place-items:center;text-align:center;font:700 5.6pt 'JetBrains Mono',monospace;letter-spacing:.6pt;color:rgba(200,180,255,.8);transform:rotate(-12deg)}
/* white salary slip with the full Flow Studio look */
.page.w{background:#ffffff;color:#16131f;--ink:#16131f;--mut:#6b6780;--line:rgba(30,20,60,.12)}
.page.w .glow{opacity:.18}.page.w .g2{opacity:.12}
.page.w .card{background:linear-gradient(140deg,#f6f3ff,#fdf7fb);border-color:rgba(155,92,255,.18)}
.page.w .qt .no{color:#b8860b}.page.w .brand p{color:#6b6780}
.earn{display:grid;grid-template-columns:1fr 1fr;gap:4mm}
.earn table td{border-color:rgba(30,20,60,.08)}
.net{display:flex;justify-content:space-between;align-items:center;border-radius:4mm;padding:4mm 6mm;background:linear-gradient(120deg,#3b82ff,#9b5cff 45%,#ff3d9a);color:#fff}
.net .k{color:rgba(255,255,255,.8)}.net b{font-family:'Inter Tight',Inter;font-size:24pt;font-weight:800;line-height:1}.net small{display:block;font-size:8pt;opacity:.9;margin-top:1mm}
.chip2{display:inline-block;padding:1mm 3mm;border-radius:99px;font:700 7pt 'JetBrains Mono',monospace;letter-spacing:1pt}
.chip2.paid{background:rgba(34,211,127,.15);color:#0f9d58;border:1px solid rgba(34,211,127,.4)}.chip2.iss{background:rgba(255,212,59,.18);color:#9a7400;border:1px solid rgba(255,190,0,.4)}
.page.w footer{color:#6b6780}
</style></head><body>
<div class="tb" id="tb" hidden><button class="pr" type="button" id="pdf">⬇ Download PDF</button></div>
<div class="stage"><div class="sc" id="sc"></div></div>
<script>
function dec(s){s=s.replace(/-/g,"+").replace(/_/g,"/");const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return JSON.parse(new TextDecoder().decode(u))}
const e=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inr=n=>"₹"+Math.round(+n||0).toLocaleString("en-IN");
const MON=m=>{try{return new Date(m+"-01T00:00:00").toLocaleDateString("en-GB",{month:"long",year:"numeric"})}catch(x){return m}};
const words=n=>{n=Math.round(n);if(!n)return"Zero";const a=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"],b=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
 const t=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?" "+a[x%10]:""),h=x=>x>=100?a[Math.floor(x/100)]+" Hundred"+(x%100?" "+t(x%100):""):t(x);let o="";const cr=Math.floor(n/1e7),l=Math.floor(n/1e5)%100,th=Math.floor(n/1e3)%100,r=n%1000;if(cr)o+=h(cr)+" Crore ";if(l)o+=t(l)+" Lakh ";if(th)o+=t(th)+" Thousand ";if(r)o+=h(r);return o.trim()};
const HEAD=(lbl,title,no)=>`<div class="bar"></div><div class="glow g1"></div><div class="glow g2"></div>
<header><div class="brand"><img src="logo.webp" alt=""><div><h1>Flow <span class="rbt">Studio</span></h1><p>Turn your dreams into visuals.</p></div></div><div class="qt"><div class="lbl">${lbl}</div><h2>${title}</h2><div class="no">${e(no)}</div></div></header>`;
const FOOT=`<footer><span>PIXELFLOWSTUDIO.AGENCY</span><span>FLOWSTUDIO91@GMAIL.COM</span><span>WHATSAPP +91 93704 17863</span></footer>`;
function letter(d){const m=d.emp||{},first=String(m.name||"").split(" ")[0];
 return `<div class="page">${HEAD("HUMAN RESOURCES","JOINING LETTER",d.ref)}
<div class="meta"><div class="card"><div class="k">Issued to</div><b>${e(m.name)}</b><div style="color:var(--mut);font-size:8.4pt;margin-top:1mm">${e(m.role||"Team member")} · ${e(m.dept||"")}<br>${e(m.phone||"")}${m.email?" · "+e(m.email):""}${d.address?"<br>"+e(d.address):""}</div></div>
<div class="card kv"><span>Letter date</span><span>${e(d.date)}</span><span>Employee code</span><span>${e(m.tid)}</span><span>Date of joining</span><span>${e(d.joinDate||"—")}</span><span>Reports to</span><span>${e(d.reportTo||"Founder & MD")}</span></div></div>
<div class="body"><h3><i></i>Subject: Appointment as ${e(m.role||"Team Member")}</h3>
<p>Dear <b>${e(first)}</b>,</p>
<p>We are delighted to welcome you to <b>Flow Studio</b>. With reference to your interview and our discussions, we are pleased to appoint you as <b>${e(m.role||"Team Member")}</b> in our <b>${e(m.dept||"Creative")}</b> team, on the terms below. Your employee code is <b>${e(m.tid)}</b>; please use it for attendance and in all official communication.</p></div>
<div><h3><i></i>Appointment details</h3><div class="dt">
<div class="card"><div class="k">Salary</div><b>${e(d.ctc||"As discussed")}</b></div><div class="card"><div class="k">Working hours</div><b>${e(d.hours||"")}</b></div><div class="card"><div class="k">Place of work</div><b>${e(d.place||"")}</b></div>
<div class="card"><div class="k">Probation</div><b>${e(d.probation||"")}</b></div><div class="card"><div class="k">Notice period</div><b>${e(d.notice||"")}</b></div><div class="card"><div class="k">Department</div><b>${e(m.dept||"—")}</b></div></div></div>
<div class="card"><div class="k">Terms of employment</div><ol>${(d.terms||[]).map(t=>`<li>${e(t)}</li>`).join("")}</ol></div>
<div class="two"><div class="card"><div class="k">Documents to submit on joining</div><ol><li>Photo ID (Aadhaar / PAN / passport)</li><li>Address proof</li><li>Two passport-size photos</li><li>Bank account details for salary</li></ol></div><div class="card"><div class="k">Your first week</div><ol><li>Collect your ID card and lanyard</li><li>Sign in to the team dashboard with your Gmail</li><li>Meet the team and get your first project</li></ol></div></div>
<div class="body"><p>Please sign a copy of this letter as your acceptance. We look forward to creating great work together. Welcome to the team!</p></div>
<div class="sig" style="position:relative"><div class="s"><div class="space" style="position:relative;height:12mm"><img class="sigimg" src="sig-white.png?v=2" alt=""></div><b>Arsalan Ahmed Shaikh</b>Founder &amp; Managing Director · For Flow Studio</div><div class="s"><div class="space" style="height:12mm"></div><b>${e(m.name)}</b>Employee acceptance · Date</div><div class="stamp">FLOW<br>STUDIO<br>HR</div></div>
${FOOT}</div>`}
function slip(d){const m=d.emp||{},rows=Math.max((d.earn||[]).length,(d.ded||[]).length,1),bank=d.bank||{};
 const tb=(L,ttl,tot)=>`<div><h3><i></i>${ttl}</h3><table><tr><th>Component</th><th class="r">Amount</th></tr>${L.map(x=>`<tr><td>${e(x.l)}</td><td class="r">${inr(x.v)}</td></tr>`).join("")||'<tr><td colspan="2" style="color:var(--mut)">—</td></tr>'}<tr><td><b>Total</b></td><td class="r"><b>${inr(tot)}</b></td></tr></table></div>`;
 return `<div class="page w">${HEAD("PAYSLIP","SALARY SLIP",MON(d.month))}
<div class="meta"><div class="card"><div class="k">Employee</div><b>${e(m.name)}</b><div style="color:var(--mut);font-size:8.4pt;margin-top:1mm">${e(m.role||"")} · ${e(m.dept||"")}<br>Employee code <b style="color:var(--ink)">${e(m.tid)}</b> · Joined ${e(m.joined||"—")}</div></div>
<div class="card kv"><span>Pay month</span><span>${MON(d.month)}</span><span>Working days</span><span>${e(d.days||"—")}</span><span>Days present</span><span>${e(d.present||"—")}</span><span>Overtime</span><span>${e(d.otHours||"0")} h</span></div></div>
<div class="earn">${tb(d.earn||[],"Earnings",d.gross)}${tb(d.ded||[],"Deductions",d.deductions)}</div>
<div class="net"><div><div class="k">NET PAY · ${MON(d.month).toUpperCase()}</div><b>${inr(d.net)}</b><small>Rupees ${words(d.net)} only</small></div><div style="text-align:right"><span class="chip2 ${d.status==="paid"?"paid":"iss"}" style="background:rgba(255,255,255,.2);color:#fff;border-color:rgba(255,255,255,.4)">${d.status==="paid"?"PAID":"ISSUED"}</span>${d.paidOn?`<small>Paid on ${e(d.paidOn)}</small>`:""}</div></div>
<div class="dt"><div class="card"><div class="k">Gross earnings</div><b>${inr(d.gross)}</b></div><div class="card"><div class="k">Total deductions</div><b>${inr(d.deductions)}</b></div><div class="card"><div class="k">Attendance</div><b>${e(d.present||"—")} / ${e(d.days||"—")} days</b></div></div>
<div class="two"><div class="card kv" style="grid-template-columns:auto 1fr"><span>Bank</span><span>${e(bank.bank||"—")}</span><span>Account</span><span>${bank.acno?"•••• "+e(String(bank.acno).slice(-4)):"—"}</span><span>IFSC</span><span>${e(bank.ifsc||"—")}</span><span>PAN / UAN</span><span>${e(bank.pan||"—")} / ${e(bank.uan||"—")}</span></div>
<div class="card"><div class="k">Note</div><div style="font-size:8.6pt">${e(d.note||"Salary is credited to the bank account above. For any question, contact the HR desk within 7 days.")}</div></div></div>
<div class="sig" style="position:relative"><div class="s"><div class="space" style="position:relative;height:12mm"><img class="sigimg" src="sig-navy.png" alt=""></div><b>Arsalan Ahmed Shaikh</b>Founder &amp; Managing Director · Authorised signatory</div><div class="s"><div class="space" style="height:12mm"></div><b>${e(m.name)}</b>Employee signature</div><div class="stamp" style="color:rgba(110,70,200,.8);border-color:rgba(155,92,255,.5)">FLOW<br>STUDIO<br>PAYROLL</div></div>
<div style="color:var(--mut);font-size:7.2pt;text-align:center">This salary slip is issued by Flow Studio from its payroll dashboard.</div>
${FOOT}</div>`}
let d=null;try{const m=/[#&]d=([\w-]+)/.exec(location.hash);d=m&&dec(m[1])}catch(x){}
const sc=document.getElementById("sc");
if(!d){sc.innerHTML='<p class="err">This document link is incomplete. Please ask Flow Studio to send it again.</p>'}
else{document.title=d.type==="slip"?`Salary slip ${(d.emp||{}).tid||""} ${d.month||""}`:`Joining letter ${(d.emp||{}).tid||""}`;sc.innerHTML=d.type==="slip"?slip(d):letter(d);document.getElementById("tb").hidden=false;
 document.getElementById("pdf").onclick=()=>window.print();
 const fit=()=>{const pg=sc.firstElementChild,w=pg.offsetWidth,s=Math.min(1,(innerWidth-24)/w);sc.style.transform=`scale(${s})`;sc.style.height=pg.offsetHeight*s+"px"};fit();addEventListener("resize",fit);}
</script></body></html>
